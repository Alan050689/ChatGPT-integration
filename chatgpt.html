<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT - Power BI</title>
    <style>
      body { font-family: sans-serif; padding: 20px; background: #f6f8fa; }
      #chat { border: 1px solid #ccc; background: white; padding: 10px; height: 400px; overflow-y: auto; }
      input, button { padding: 10px; margin-top: 10px; }
      input { width: 70%; }
      button { cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>🤖 ChatGPT en Power BI</h2>
    <div id="chat"></div>
    <input id="msg" placeholder="Escribí tu pregunta..." />
    <button onclick="send()">Enviar</button>

    <script>
      const OPENAI_API_KEY = "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"; // 👈 pegá tu API key

      async function send() {
        const input = document.getElementById("msg");
        const chat = document.getElementById("chat");
        const userMessage = input.value.trim();
        if (!userMessage) return;

        chat.innerHTML += `<p><b>Vos:</b> ${userMessage}</p>`;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        chat.innerHTML += `<p><i>Escribiendo...</i></p>`;
        chat.scrollTop = chat.scrollHeight;

        try {
          const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + OPENAI_API_KEY
            },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: [{ role: "user", content: userMessage }]
            })
          });

          const data = await response.json();
          const answer = data.choices?.[0]?.message?.content || "No se recibió respuesta.";
          chat.innerHTML = chat.innerHTML.replace("<p><i>Escribiendo...</i></p>", "");
          chat.innerHTML += `<p><b>ChatGPT:</b> ${answer}</p>`;
          chat.scrollTop = chat.scrollHeight;
        } catch (err) {
          chat.innerHTML += `<p style='color:red'><b>Error:</b> ${err.message}</p>`;
        }
      }
    </script>
  </body>
</html>
